name: Sync comic releases

on:
  schedule:
    # Cada 3 días a las 07:00 UTC (08:00 CET / 09:00 CEST — hora de Madrid).
    # Además de actualizar el catálogo, escribe en Supabase y evita que el
    # proyecto (plan gratuito) se pause por inactividad.
    - cron: '0 7 */3 * *'
  workflow_dispatch:

permissions:
  contents: write  # para el commit de keepalive

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Run sync worker
        working-directory: worker
        run: python main.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          METRON_USER: ${{ secrets.METRON_USER }}
          METRON_PASS: ${{ secrets.METRON_PASS }}

      # GitHub desactiva los workflows programados tras 60 días sin commits en el
      # repo. Si el último commit tiene más de 45 días, hacemos uno vacío.
      - name: Keepalive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "Último commit hace $days días"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive del workflow de sync"
            git push
          fi
